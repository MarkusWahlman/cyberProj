# docker-compose.yml
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Run the frontend dev script
    command: pnpm --filter frontend run dev
    ports:
      - "5173:5173"
    volumes:
      # Mount your live code into the container for HMR
      - .:/app
      # THE TRICK: Override the mapped node_modules with anonymous container volumes.
      # This prevents your host OS binaries from crashing the Linux container.
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/backend/node_modules
      - /app/shared/node_modules
    environment:
      # Tells Vite to poll for file changes
      - CHOKIDAR_USEPOLLING=true

  backend:
    depends_on:
      - db
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter backend run dev
    env_file:
      - backend/.env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/backend/node_modules
      - /app/shared/node_modules

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: dev_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: